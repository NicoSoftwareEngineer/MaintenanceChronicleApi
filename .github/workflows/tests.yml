name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Run unit tests
        run: dotnet test src/MaintenanceChronicle.Application.Tests/MaintenanceChronicle.Application.Tests.csproj --configuration Release --verbosity minimal

  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Run integration tests
        run: dotnet test src/MaintenanceChronicle.Integration.Tests/MaintenanceChronicle.Integration.Tests.csproj --configuration Release --verbosity minimal
